# Licence policy of the StudyLife app bundle - the single source of truth for scripts/licences/check.py.
# The script reads the resolved NuGet graph from the build system (dotnet restore ->
# obj/project.assets.json) and each package's licence from its .nuspec; nothing about individual
# packages is hard-coded in the script. THIRD-PARTY-NOTICES.md is generated from this file plus
# that data, and CI fails when it is stale or a rule below is violated.
#
# A licence that cannot be read from the package ("UNKNOWN": no SPDX expression, only a licenseUrl
# or nothing at all) always fails, unless a [[exception]] below names that package and the exact
# licence that was verified by hand.

[bundle]
# Target frameworks whose bundles the notices describe. Android and Windows are not covered yet.
frameworks = ["net10.0-ios", "net10.0-maccatalyst"]
project = "src/StudyLife.App/StudyLife.App.csproj"
notices = "THIRD-PARTY-NOTICES.md"
# The notices file must reach the bundle as this MauiAsset (checked in the csproj).
asset_logical_name = "THIRD-PARTY-NOTICES.md"

[licenses]
# SPDX ids that may appear on a third-party NuGet package without further ado. Each needs the
# licence text under scripts/licences/texts/<id>.txt (the notices file embeds it).
allowed = ["MIT", "BSD-2-Clause"]
# Third-party code under these families must never be in the bundle (App Store distribution;
# FSF position). Matched case-insensitively against every id in a licence expression. Exceptions
# cannot lift a denied id.
denied = ["GPL-*", "AGPL-*", "LGPL-*"]

[[exception]]
package = "Toolbelt.Blazor.I18nText"
license = "MPL-2.0"
source = "https://github.com/jsakamoto/Toolbelt.Blazor.I18nText/"
reason = "MPL-2.0 is file-level copyleft: it only covers the package's own files (its assembly and the shipped helper.min.js / *.lib.module.js), not the app. Allowed unmodified; the notice and the source location below satisfy MPL-2.0 section 3.2 for the executable form."

[[exception]]
package = "Toolbelt.Blazor.I18nText.SourceGenerator"
license = "MPL-2.0"
source = "https://github.com/jsakamoto/Toolbelt.Blazor.I18nText/"
reason = "Same project and licence as Toolbelt.Blazor.I18nText. A compile-time analyzer, not part of the shipped bundle; listed for completeness. MPL-2.0 is file-level copyleft, allowed unmodified."

# Components that are in the bundle but not in the NuGet graph. Each one is listed in the notices
# with its licence; "text" names a file under scripts/licences/texts/ that is embedded.
[[component]]
name = "DM Sans and DM Mono (web fonts, from the studylife client wwwroot)"
license = "OFL-1.1"
url = "https://github.com/lukislp/studylife/tree/main/src/StudyLife.Client/wwwroot/fonts"
copyright = [
  "Copyright 2014 The DM Sans Project Authors (https://github.com/googlefonts/dm-fonts)",
  "Copyright 2020 The DM Mono Project Authors (https://www.github.com/googlefonts/dm-mono)",
]
text = "OFL-1.1"

[[component]]
name = ".NET runtime (Mono) and the Apple platform runtime packs"
license = "MIT"
url = "https://github.com/dotnet/runtime"
copyright = ["Copyright (c) .NET Foundation and Contributors"]
text = "MIT"
