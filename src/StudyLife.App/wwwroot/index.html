<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!--
      Content-Security-Policy for the bundled page (audit 2026-11-16, finding H1). The server's
      CSP header (studylife: src/StudyLife.Server/Program.cs) never reaches this page: the
      BlazorWebView serves it from the app bundle (app://0.0.0.1 on iOS/Mac Catalyst,
      https://0.0.0.1 on Android/Windows), so it carries its own policy as a meta tag. It mirrors
      the server's policy directive by directive; the differences are explained below.
      It must stay the first thing in <head>: a meta CSP only covers what comes after it.

      default-src 'self'           Everything not listed below: the app bundle only (this also
                                   covers frame-src and worker-src: no frames, no workers).
      script-src 'self'            Script files from the bundle only (blazor.webview.js,
                                   js/native-*.js, the client's *.razor.js modules). No inline
                                   script and no inline event handlers - that is the point:
                                   injected markup cannot run script. Unlike the server, no
                                   'wasm-unsafe-eval': a BlazorWebView runs .NET natively in the
                                   app process and loads no WebAssembly; blazor.webview.js uses
                                   no eval either.
      style-src 'self'             Stylesheets from the bundle only (css/*, scoped-CSS bundle),
      style-src-elem 'self'        no <style> elements - as on the server.
      style-src-attr 'unsafe-inline'
                                   style="" attributes only: Razor components bind dynamic values
                                   into style attributes and Blazor applies them with
                                   setAttribute(); same single relaxation as the server.
      font-src 'self'              Self-hosted fonts (fonts/*.woff2).
      img-src 'self' data:         Bundled images and data: URIs, as on the server. Remote images
                                   (for example in a Markdown note) are blocked, so opening a note
                                   cannot make the app contact a third-party host.
      media-src 'self' data:       "Read note aloud" plays the WAV as a data: URI.
      connect-src 'self'           Only blazor.webview.js's own fetch of
                                   _framework/blazor.modules.json. The app's server traffic
                                   (API, sign-in, Marketplace catalogue) goes through the .NET
                                   HttpClient in the native process, outside the WebView, so CSP
                                   does not apply to it and the user-configured server URL needs
                                   no entry here. A future fetch() from page script to the
                                   server would have to be added explicitly.
      base-uri 'self'              <base href="/"> only.
      form-action 'self'           No form posts anywhere else.
      object-src 'none'            No plugins.
      Not set, because a meta CSP ignores them: frame-ancestors (the page is the app's own
      top-level WebView, nothing can frame it), report-uri/report-to, sandbox.
      Not affected by this policy: the native hosts' own script injection (Blazor start-up,
      the message bridge) and the native message channel.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StudyAtrium</title>
    <base href="/" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/stats.css" />
    <link rel="stylesheet" href="css/calendar.css" />
    <link rel="stylesheet" href="css/focus.css" />
    <link rel="stylesheet" href="css/setup.css" />
    <link rel="stylesheet" href="css/notes.css" />
    <link rel="stylesheet" href="css/planner.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/print.css" />
    <link rel="stylesheet" href="css/progressshare.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <meta name="theme-color" content="#0e0e0f" />
    <meta name="color-scheme" content="dark light" />
</head>
<body>
    <div id="app">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background:#0e0e0f;color:#e8e6e0">
            <div style="text-align:center">
                <div style="font-size:2rem;margin-bottom:1rem;color:#CC785C">✦</div>
                <div style="font-size:0.875rem;color:#6b6965;letter-spacing:0.05em">Loading StudyAtrium</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/native-interop.js"></script>
    <script src="js/native-bridge.js"></script>
</body>
</html>
