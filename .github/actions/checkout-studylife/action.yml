name: Check out the pinned StudyLife release
description: >
  Checks out lukislp/studylife at the release named in studylife.version (repository root) into
  ./studylife, the sibling the app's project reference expects. The repository itself must be
  checked out first.

runs:
  using: composite
  steps:
    - name: Read the pin
      id: pin
      shell: bash
      run: |
        ref="$(tr -d '[:space:]' < studylife.version)"
        if ! [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=studylife.version::expected a release tag like v3.33.2, got '$ref'"
          exit 1
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: lukislp/studylife
        ref: ${{ steps.pin.outputs.ref }}
        path: studylife
        persist-credentials: false
