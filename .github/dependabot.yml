# Weekly Dependabot updates: GitHub Actions and NuGet (grouped). MAUI packages follow the workload, not Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    # 10, not 2: this repo calls five lukislp/ci-workflows artifacts (auto-merge, dependency-review,
    # lockfiles, semantic-release, deploy-key-push) that all move on every ci-workflows release.
    # With a limit of 2 Dependabot could open only two of them per daily run - the rest waited
    # for the next day even though auto-merge closes each PR within minutes - and on 2026-09-29
    # the third bump of a run was reported "created" but never appeared at all. Every one of
    # these PRs is a routine pin bump that auto-merge takes care of, so the limit protects nothing.
    open-pull-requests-limit: 10
    # GitHub applies a 3-day cooldown to github-actions updates by default (visible in the
    # Dependabot job log as "cooldown days 3" even without this block). Kept for third-party
    # actions - a freshly cut release of someone else's action should sit for a while - but
    # pointless for our own lukislp/ci-workflows pins: those releases are our own merges, and
    # the cooldown made Dependabot report v1.7.9 as "latest" while v1.7.15 was out, so the
    # shared workflows lagged three days behind in every repo.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/ci-workflows/*"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    ignore:
      # MAUI packages must match the installed workload; bump them together with the SDK.
      - dependency-name: "Microsoft.Maui.*"
      - dependency-name: "Microsoft.AspNetCore.Components.WebView.Maui"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
