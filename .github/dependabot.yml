# Weekly Dependabot updates: GitHub Actions and NuGet (grouped). MAUI packages follow the workload, not Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    ignore:
      # MAUI packages must match the installed workload; bump them together with the SDK.
      - dependency-name: "Microsoft.Maui.*"
      - dependency-name: "Microsoft.AspNetCore.Components.WebView.Maui"
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
