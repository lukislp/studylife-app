# Weekly Dependabot updates: GitHub Actions, NuGet (grouped) and the hash-locked pip set of scripts/. MAUI packages follow the workload, not Dependabot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    # 10, not 2: this repo calls five lukislp/ci-workflows artifacts (auto-merge, dependency-review,
    # lockfiles, semantic-release, deploy-key-push) that all move on every ci-workflows release.
    # With a limit of 2 Dependabot could open only two of them per daily run - the rest waited
    # for the next day even though auto-merge closes each PR within minutes - and on 2026-09-29
    # the third bump of a run was reported "created" but never appeared at all. Every one of
    # these PRs is a routine pin bump that auto-merge takes care of, so the limit protects nothing.
    open-pull-requests-limit: 10
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["Microsoft.*", "System.*", "Npgsql.*"]
    ignore:
      # MAUI packages must match the installed workload; bump them together with the SDK.
      - dependency-name: "Microsoft.Maui.*"
      - dependency-name: "Microsoft.AspNetCore.Components.WebView.Maui"
      # Stay on the .NET 10 LTS line: .NET 10 and .NET 11 both end support on 2028-11-14, so 11 brings
      # nothing. Only the 11.x line is skipped; the range ends below 12, so .NET 12 (next LTS, November
      # 2027) is proposed normally and nothing has to be removed then.
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["11.*"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: ["11.*"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: ["11.*"]
      - dependency-name: "System.*"
        versions: ["11.*"]
      - dependency-name: "dotnet-ef"
        versions: ["11.*"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        versions: ["11.*"]
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
  # scripts/requirements-kuma.txt (pip-compile with hashes, see requirements-kuma.in): without
  # this entry security fixes there only showed up as alerts, never as PRs.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
