name: Dependency review

# Thin caller of the shared implementation in lukislp/ci-workflows - the triggers stay here
# because a reusable workflow cannot declare them for the caller. Compares the base and head
# dependency graphs of a pull request and fails it when the PR introduces a dependency with a
# known advisory, which Dependabot alerts would otherwise only report after the merge. The
# check name in the branch ruleset is "review / dependency-review".
on:
  pull_request:
    types: [opened, synchronize, reopened]

# One run per PR: a newer push cancels the run it supersedes.
concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    uses: lukislp/ci-workflows/.github/workflows/dependency-review.yml@a463e9901195058d0948a7f6f3a7cde0f202ea9e # v1.11.1
    # Third-party code under the GPL, AGPL or LGPL families cannot go through the App Store (see
    # README "License"). The shared workflow takes SPDX ids without wildcards, so every id of the
    # three families is listed. THIRD-PARTY-NOTICES.md and the test-licences job cover the NuGet
    # graph of the bundle itself; this one covers what the dependency graph reports on a PR.
    with:
      deny-licenses: >-
        GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
        LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later,
        AGPL-3.0-only, AGPL-3.0-or-later
    # pull-requests: write is what the summary comment needs; the called workflow keeps
    # contents at read.
    permissions:
      contents: read
      pull-requests: write
