name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for the backfill-release-signatures job at the bottom of this file.
  # Nothing else in this workflow runs on it.
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to sign, space separated. Empty means the five most recent releases."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Test/build stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  # Every job needs a sibling checkout of the public studylife repo at
  # ./studylife (matching src/StudyLife.App/StudyLife.App.csproj's relative
  # ProjectReference "..\..\studylife\src\StudyLife.Client\..." - see the
  # README's "Building" section) - the app's entire Blazor UI comes from
  # there via project reference, no copy.
  test-android:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # maui-ios/maui-maccatalyst aren't even installable on Linux ("Workload ID maui-ios
      # isn't supported on this platform"), so installing every workload everywhere (an
      # earlier attempt) can't work here. A -p:TargetFrameworks=/-p:TargetFramework=
      # command-line override was tried next - those are *global* MSBuild properties, so
      # they also propagate into the referenced StudyLife.Client/StudyLife.Shared projects
      # (plain net10.0 libraries, not MAUI multi-targeted) and corrupt their restore.
      # Reducing <TargetFrameworks> (plural) to one item was tried after that - restore
      # then worked, but Publish itself still refused ("targets multiple frameworks"),
      # because the plural element name alone keeps the SDK in cross-targeting/outer-build
      # mode regardless of list length, which requires an explicit -f/-p:TargetFramework
      # to select from it - right back to the global-property propagation problem.
      # Renaming the element to the *singular* <TargetFramework> sidesteps all of this:
      # a real single-targeted project needs no outer/inner build split and no
      # command-line selection at all, and it's still just a local edit to this one file.
      - run: sed -i -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-android</TargetFramework>|' src/StudyLife.App/StudyLife.App.csproj
      - run: dotnet workload install maui-android
      # Runs the release build script (scripts/build-android-apk.sh) end to end - version
      # injection, signing through env: password references, apksigner/aapt2 verification -
      # with a throwaway key generated here, because release-android only runs after a merge.
      # The resulting APK is a test build: its key exists for this run only, so it can never
      # update an installed release. It stays downloadable for trying out a pull request,
      # under an artifact name the release job's "StudyLife-*" download pattern does not match.
      - name: Generate a throwaway signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/throwaway.keystore" \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=StudyLife CI test build, O=not for distribution" \
            -storepass throwaway-ci-only -keypass throwaway-ci-only
      - name: Build, sign and verify a test APK
        env:
          # Not 0.0.1: its versionCode 1 equals the csproj default and would prove nothing.
          APP_VERSION: 9.87.65
          ANDROID_KEYSTORE: ${{ runner.temp }}/throwaway.keystore
          ANDROID_KEYSTORE_PASSWORD: throwaway-ci-only
          ANDROID_KEY_ALIAS: throwaway
          APK_OUTPUT: StudyLife-android-test.apk
          APK_SUMMARY_TITLE: test build, throwaway key
        run: bash scripts/build-android-apk.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-apk
          path: StudyLife-android-test.apk
          if-no-files-found: error
          retention-days: 5

  # Pure text comparison, no dotnet/workload install needed - catches the "works on web,
  # throws immediately on native" DI/JS-interop mirroring gap (see scripts/check-native-parity.sh)
  # before any of the build jobs below even start. iOS device installs are deliberately not
  # part of CI at all (see the README), so this is the only automated net for that platform.
  test-native-parity:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - run: bash scripts/check-native-parity.sh
      # Profile checks and entitlement generation of the Apple release jobs (scripts/apple),
      # plus a syntax check of their shell scripts - the signed path itself only runs on main.
      - name: Test the Apple signing helpers
        run: |
          python3 -m unittest discover -s scripts/apple -v
          for f in scripts/apple/*.sh scripts/build-ios-ipa.sh; do bash -n "$f"; done
      # The Android versionCode formula must never go backwards (scripts/build-android-apk.sh).
      - name: Check the Android versionCode scheme
        run: |
          set -euo pipefail
          check() { [ "$(bash scripts/build-android-apk.sh version-code "$1")" = "$2" ] || { echo "::error::$1 should map to $2"; exit 1; }; }
          check 1.8.28 10828
          check 1.9.0 10900
          check 2.0.0 20000
          check 1.99.99 19999
          for bad in 1.100.0 1.0.100 1.2 v1.2.3; do
            if bash scripts/build-android-apk.sh version-code "$bad" 2>/dev/null; then
              echo "::error::$bad must be rejected"; exit 1
            fi
          done

  test-maccatalyst:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # BSD/macOS sed requires -i to take an explicit backup-suffix argument (even '') -
      # `sed -i -E '...'` silently consumes -E as that suffix instead of enabling extended
      # regex, so the substitution below was running in basic-regex mode without the author
      # noticing (it happened to still match, since the pattern doesn't need ERE syntax).
      - run: sed -i '' -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-maccatalyst</TargetFramework>|' src/StudyLife.App/StudyLife.App.csproj
      # Workload set 10.0.401.1 (2026-09-28) moved microsoft.net.sdk.maccatalyst to 27.0.10722,
      # which hard-requires Xcode 27.0 - but macos-latest (macos-26-arm64) still ships Xcode 26.6
      # as its newest Xcode, so an unpinned install fails at publish with "requires Xcode 27.0".
      # 10.0.401 (maccatalyst 26.5.10318) is the last set that builds on that image. Drop the
      # pin once the runner image lists an Xcode 27.x under /Applications.
      - run: dotnet workload install maui-maccatalyst --version 10.0.401
      # The TestFlight path (apple-testflight.yml) with ad-hoc signatures: same build, inside-out
      # signing with the real entitlements (App Sandbox for TestFlight, hardened runtime for
      # the ZIP), a launch check of both variants and an unsigned .pkg - no secrets needed.
      - name: Build, sign ad hoc and launch-check both Mac variants
        env:
          SIGN_MODE: adhoc
          APP_VERSION: 9.87.65
        run: bash scripts/apple/release-maccatalyst.sh
      # Not "StudyLife-*": the release asset comes from release-macos, never from this job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-app
          path: StudyLife-macos.zip
          if-no-files-found: error
          retention-days: 5

  # The whole iOS bundle (.NET app, Live Activity bridge, widgets, share extension, Apple
  # Watch app) assembled and ad-hoc signed by the same script testflight-ios runs with the
  # distribution certificate. Proves the build on every pull request without any secret.
  test-ios:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Same single-target patch and workload pin as test-maccatalyst (see the comments there).
      - run: sed -i '' -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-ios</TargetFramework>|' src/StudyLife.App/StudyLife.App.csproj
      - run: dotnet workload install maui-ios --version 10.0.401
      - run: bash scripts/apple/install-xcodegen.sh
      - name: Build the full iOS bundle and sign it ad hoc
        env:
          SIGN_MODE: adhoc
          APP_VERSION: 9.87.65
        run: bash scripts/apple/release-ios.sh

  test-windows:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # audit, not block: harden-runner >= 2.20 enforces the block on Windows runners too,
          # and the agent's DNS setup failed there on 2026-09-23 ("Could not resolve host: github.com").
          egress-policy: audit
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # The Windows TFM is added by a *second*, conditional <TargetFrameworks> element
      # (only active when IsOSPlatform('windows')) that appends onto the first via
      # $(TargetFrameworks). Converting only that second line to singular <TargetFramework>
      # left the first (still plural, still listing android;ios;maccatalyst) in place too -
      # restore ended up using that stale plural list instead of the intended windows-only
      # target, so publish then found no matching entry in project.assets.json. Deleting the
      # first line outright removes the ambiguity: only the singular declaration remains.
      - name: Restrict to one target framework
        shell: bash
        run: |
          sed -i -E \
            -e '/<TargetFrameworks>net10\.0-android;net10\.0-ios;net10\.0-maccatalyst<\/TargetFrameworks>/d' \
            -e 's|<TargetFrameworks (Condition="[^"]*")>\$\(TargetFrameworks\);net10\.0-windows10\.0\.19041\.0</TargetFrameworks>|<TargetFramework \1>net10.0-windows10.0.19041.0</TargetFramework>|' \
            src/StudyLife.App/StudyLife.App.csproj
      - run: dotnet workload install maui-windows
      # WindowsPackageType=None -> plain unpackaged folder, no MSIX signing needed.
      # No -p:SelfContained/-p:RuntimeIdentifier overrides: forcing those triggered NuGet
      # to resolve a nonexistent Microsoft.NETCore.App.Runtime.Mono.win-x64 10.0.10
      # package (a broken runtime-pack resolution specific to that combination) -
      # framework-dependent (needs the .NET 10 runtime on the target machine) is an
      # acceptable tradeoff here since this is unsigned personal-use distribution anyway.
      - run: dotnet publish src/StudyLife.App/StudyLife.App.csproj -c Release -p:WindowsPackageType=None
      - name: Zip the publish output
        shell: pwsh
        run: |
          $publishDir = Get-ChildItem -Path "src/StudyLife.App/bin/Release/net10.0-windows10.0.19041.0" -Recurse -Directory -Filter "publish" | Select-Object -First 1
          Compress-Archive -Path "$($publishDir.FullName)/*" -DestinationPath StudyLife-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StudyLife-windows
          path: StudyLife-windows.zip
          retention-days: 5

  test-lint:
    # dotnet format has no -f/-p flag to scope itself to one TargetFramework - it always
    # restores every TFM the project lists, so the same csproj-patching trick as the
    # other jobs applies here too. Code style doesn't differ by target framework, so
    # android (the cheapest runner) stands in for all of them.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: sed -i -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-android</TargetFramework>|' src/StudyLife.App/StudyLife.App.csproj
      - run: dotnet workload install maui-android
      - run: dotnet format src/StudyLife.App/StudyLife.App.csproj --verify-no-changes

  # ---------------------------------------------------------------------
  # Version / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test-android, test-ios, test-maccatalyst, test-windows, test-lint, test-native-parity]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studylife-app-release-chain
      cancel-in-progress: false
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely - confirmed
    # live on the studylife-ai sibling repo (2026-08-12).
    permissions:
      contents: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Ruleset bypass for the release commit (2026-09-11 main-protection rollout): main is
      # protected by a ruleset (pull request + green test stage) that the GitHub Actions app
      # cannot be a bypass actor for on a personal repository, so semantic-release pushes over
      # SSH as a write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset -
      # the push then goes through the GITHUB_TOKEN https remote exactly as before. Needed in
      # get-version too: @semantic-release/git's verifyConditions runs `git push --dry-run`
      # even in dry-run mode. Same mechanism as lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@4b19e87569c767e2855b4a53292d8edfe4065de4 # v1.8.3
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. Downstream jobs below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  # The release APK. Built only after get-version has determined the next version, so the
  # app carries it (ApplicationDisplayVersion = versionName, ApplicationVersion = versionCode),
  # and signed with the project's own release key, so every release installs as an update over
  # the previous one. Android only accepts an update when the signing certificate is identical
  # and the versionCode is higher - the per-runner debug key of test-android and the fixed
  # versionCode 1 broke both. Secrets (README, "Release signing"): ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and the optional ANDROID_KEY_PASSWORD
  # (defaults to the keystore password). A missing secret fails this job and with it the
  # release - a debug-signed APK is never published again.
  release-android:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            github.com:22
            github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            uploads.github.com:443
      - name: Release keystore configured?
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ANDROID_KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing. No release is published without a release-signed APK (README, \"Release signing\")."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Same single-target patch as test-android (see the comment there).
      - run: sed -i -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-android</TargetFramework>|' src/StudyLife.App/StudyLife.App.csproj
      - run: dotnet workload install maui-android
      # versionName = the release version, versionCode = major * 10000 + minor * 100 + patch
      # (scripts/build-android-apk.sh documents the limits). The script decodes the keystore
      # into RUNNER_TEMP, deletes it on exit, and fails on a debug certificate or a version
      # mismatch; the job summary lists the signer certificate's SHA-256.
      - name: Build, sign and verify the release APK
        env:
          APP_VERSION: ${{ needs.get-version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_OUTPUT: StudyLife-android.apk
          APK_SUMMARY_TITLE: release
        run: bash scripts/build-android-apk.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StudyLife-android
          path: StudyLife-android.apk
          if-no-files-found: error
          retention-days: 5

  # The StudyLife-macos.zip release asset: the same build and inside-out signing as
  # test-maccatalyst, ad hoc with the hardened runtime and the release version - no Apple
  # secret, no environment, no approval, so a release never waits for the owner (Gatekeeper
  # treats the app as unsigned, as before TestFlight existed). TestFlight builds and the
  # Developer ID notarized ZIP are made on demand by .github/workflows/apple-testflight.yml,
  # which replaces this ZIP in the release when it notarizes one (README, "Apple release signing").
  release-macos:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            github.com:22
            github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukislp/studylife
          path: studylife
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # Same single-target patch and workload pin as test-maccatalyst (see the comments there).
      - run: sed -i '' -E 's|<TargetFrameworks>[^<]*</TargetFrameworks>|<TargetFramework>net10.0-maccatalyst</TargetFramework>|' src/StudyLife.App/StudyLife.App.csproj
      - run: dotnet workload install maui-maccatalyst --version 10.0.401
      - name: Build, sign ad hoc and launch-check the Mac app
        env:
          SIGN_MODE: adhoc
          APP_VERSION: ${{ needs.get-version.outputs.version }}
        run: bash scripts/apple/release-maccatalyst.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StudyLife-macos
          path: StudyLife-macos.zip
          if-no-files-found: error
          retention-days: 5

  semantic-release:
    needs: [get-version, release-android, release-macos]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: studylife-app-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Keyless signing + build provenance for the release assets (see the last steps).
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Ruleset bypass for the release commit (2026-09-11 main-protection rollout): main is
      # protected by a ruleset (pull request + green test stage) that the GitHub Actions app
      # cannot be a bypass actor for on a personal repository, so semantic-release pushes over
      # SSH as a write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset -
      # the push then goes through the GITHUB_TOKEN https remote exactly as before. Needed in
      # get-version too: @semantic-release/git's verifyConditions runs `git push --dry-run`
      # even in dry-run mode. Same mechanism as lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@4b19e87569c767e2855b4a53292d8edfe4065de4 # v1.8.3
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: StudyLife-*
          path: release-assets
          merge-multiple: true
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between
      # this job's checkout and its own push (the concurrency group above already serializes
      # overlapping runs of this workflow, so this only guards against a genuinely external push).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        id: semrel_retry
        uses: lukislp/ci-workflows/.github/actions/semantic-release@3cc3111392db5b1b87d1b5b7dab634a96dbf6102 # v1.8.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The APK was built with the version get-version predicted. Only an out-of-band push that
      # changes the bump level between the two jobs (the retry above) can make them differ.
      - name: Check the published version against the APK's
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          PREDICTED: ${{ needs.get-version.outputs.version }}
          PUBLISHED: ${{ steps.semrel.outputs.new_release_version || steps.semrel_retry.outputs.new_release_version }}
        run: |
          if [ "$PREDICTED" != "$PUBLISHED" ]; then
            echo "::warning::Released $PUBLISHED, but the attached APK was built as $PREDICTED. The next release corrects it."
          fi
      # Signed release assets (OpenSSF Scorecard "Signed-Releases"): a keyless Sigstore
      # signature bundle per asset plus one GitHub build-provenance attestation, uploaded next
      # to the assets so a download can be verified offline:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/lukislp/studylife-app/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
      - name: Sign the release assets and attach the signature bundles
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}
        run: |
          for f in release-assets/StudyLife-*; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/studylife-app/\.github/workflows/ci-cd\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        id: provenance
        with:
          subject-path: |
            release-assets/StudyLife-*
      - name: Attach the build provenance to the release
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber

  # ---------------------------------------------------------------------
  # Signature backfill for older releases - manual dispatch only
  # ---------------------------------------------------------------------
  # Releases published before the signing step above existed carry no Sigstore bundle next
  # to their assets, and OpenSSF Scorecard's "Signed-Releases" check grades the five most
  # recent releases - so those older ones hold the score down until they age out. This job
  # signs them after the fact: for every asset of the selected releases that has no
  # <asset>.sigstore.json sibling yet, it downloads the asset, signs it keylessly, verifies
  # the bundle and uploads the bundle next to the asset. Re-running it is a no-op for
  # assets that already have a bundle.
  #
  # It deliberately lives in THIS workflow file instead of a file of its own. The keyless
  # certificate's identity is "<repo>/<workflow path>@<ref>", so a dispatch of
  # .github/workflows/ci-cd.yml on refs/heads/main mints exactly the identity the
  # release path mints, and the bundles satisfy the very same
  # --certificate-identity-regexp the release job pins. That is asserted per asset below -
  # a mismatch fails the step before anything is uploaded.
  #
  # No build provenance is attached here on purpose: attest-build-provenance would assert
  # that this run built the artifact, which is false for an artifact downloaded from an
  # older release.
  backfill-release-signatures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            aka.ms:443
            api.github.com:443
            api.nuget.org:443
            builds.dotnet.microsoft.com:443
            crl3.digicert.com:80
            dc.services.visualstudio.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the assets of releases that have no signature bundle yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "${TAGS// /}" ]; then
            read -r -a TAG_LIST <<< "$TAGS"
          else
            mapfile -t TAG_LIST < <(gh release list --repo "$REPO" --limit 5 --json tagName --jq '.[].tagName')
          fi
          if [ "${#TAG_LIST[@]}" -eq 0 ]; then
            echo "No releases to process."
            exit 0
          fi
          echo "Releases to process: ${TAG_LIST[*]}"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          SIGNED=0
          for TAG in "${TAG_LIST[@]}"; do
            [ -n "$TAG" ] || continue
            ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              # Signature bundles and provenance files are not themselves signed.
              case "$NAME" in
                *.sigstore.json | *.intoto.jsonl) continue ;;
              esac
              if printf '%s\n' "$ASSETS" | grep -Fxq "$NAME.sigstore.json"; then
                echo "$TAG/$NAME: bundle already present, skipping"
                continue
              fi
              echo "$TAG/$NAME: signing"
              gh release download "$TAG" --repo "$REPO" --pattern "$NAME" --dir "$WORK" --clobber
              cosign sign-blob --yes --bundle "$WORK/$NAME.sigstore.json" "$WORK/$NAME"
              cosign verify-blob --bundle "$WORK/$NAME.sigstore.json" \
                --certificate-identity-regexp '^https://github.com/lukislp/studylife-app/\.github/workflows/ci-cd\.yml@refs/heads/main$' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$WORK/$NAME"
              gh release upload "$TAG" "$WORK/$NAME.sigstore.json" --repo "$REPO" --clobber
              # Release assets can be hundreds of megabytes, so don't keep them on disk.
              rm -f "$WORK/$NAME" "$WORK/$NAME.sigstore.json"
              SIGNED=$((SIGNED + 1))
            done <<< "$ASSETS"
          done
          echo "Signature bundles uploaded: $SIGNED"
