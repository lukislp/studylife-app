# Minimal Xcode project ONLY for provisioning (Option B, self-signing):
# xcodebuild -allowProvisioningUpdates uses it to generate the developer certificate and
# the provisioning profiles for the app + widget extension via the (free) Personal Team
# account, and registers the iPhone connected via USB. The actual app is NOT built with
# this - the IPA built by .NET/swiftc gets signed in scripts/sign-and-install.sh.
#
# Replace every YOUR_TEAM_ID below with your own Apple Developer Team ID (Xcode ->
# Settings -> Accounts -> your Apple ID -> Team). Also update the "webcredentials:"
# associated-domain entries further down to your own server's domain.
name: StudyLifeShell
options:
  createIntermediateGroups: true
targets:
  StudyLifeShell:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources: [Shell]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studylife.mobile
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # App Group: shared container for the widget data snapshot
    # (HomeWidgetSnapshot.cs writes, StudyTodayWidget.swift reads) - also allowed with
    # a Personal Team (free tier). Associated Domains (in-app passkeys,
    # AppleInAppPasskeys.cs) and aps-environment (NativePush/ApnsTokenStore), on the
    # other hand, need the paid team - added here since that team was activated.
    # IMPORTANT: sign-and-install.sh takes the actually-effective entitlements from
    # the provisioning profile generated here (not from Entitlements.PaidSigning.plist
    # in the App repo's csproj - that path is inactive with -p:EnableCodeSigning=false),
    # so this declaration here is the only one that really counts. aps-environment gets
    # forced to "development" by Apple for a development profile anyway
    # (which matches devicectl direct installation instead of TestFlight/App Store).
    entitlements:
      path: Shell/StudyLifeShell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.studylife.mobile
        com.apple.developer.associated-domains:
          - webcredentials:studylife.example.com
        aps-environment: development
        # Mindful Minutes logging (HealthBridge.swift) - write-only.
        com.apple.developer.healthkit: true
    dependencies:
      - target: StudyLifeWidgetsShell
        embed: true
      - target: StudyLifeShareShell
        embed: true
      - target: StudyLifeWatchShell
        embed: true
  StudyLifeWidgetsShell:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    # Compiles the REAL Live Activity UI - since the swiftc/AMFI debacle, this Xcode
    # target has been the production way to build the extension (sign-and-install.sh
    # swaps it into the .NET IPA). TimerActivityAttributes is the same file as in the
    # app-side bridge (the type name must match for ActivityKit).
    sources:
      - path: ../ios-liveactivity/TimerActivityAttributes.swift
      - path: ../ios-liveactivity/TimerControlIntent.swift
      - path: ../ios-liveactivity/UpcomingSessionActivity.swift
      - path: ../ios-liveactivity/Widget/StudyLifeWidgets.swift
      - path: ../ios-liveactivity/Widget/StudyTodayWidget.swift
    info:
      path: WidgetShell/Info.plist
      properties:
        CFBundleDisplayName: StudyLife
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studylife.mobile.widgets
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    # Same App Group as the main app (reading side of the widget snapshot).
    entitlements:
      path: WidgetShell/StudyLifeWidgetsShell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.studylife.mobile
  StudyLifeShareShell:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    # Share sheet entry "StudyLife": puts shared text/URLs into the App Group inbox
    # (native/ios-share/ShareViewController.swift), the app turns them into notes.
    sources:
      - path: ../ios-share/ShareViewController.swift
    info:
      path: ShareShell/Info.plist
      properties:
        CFBundleDisplayName: StudyLife
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: ShareShell/StudyLifeShareShell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.studylife.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studylife.mobile.share
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
  # Apple Watch companion app: real production Swift code lives in ../watchos-app
  # (same convention as StudyLifeWidgetsShell referencing ../ios-liveactivity/Widget) -
  # Phase 1 step 1 is deliberately a bare placeholder view, to validate the xcodegen/
  # xcodebuild/sign-and-install pipeline for a watchOS target before any WatchConnectivity
  # wiring. Embed path/exact bundle-id convention/single-target-vs-nested-extension
  # complication support are unverified until built once on the Mac (see plan doc).
  StudyLifeWatchShell:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ../watchos-app/StudyLifeWatchApp.swift
      - path: ../watchos-app/ContentView.swift
      - path: ../watchos-app/WatchSnapshot.swift
      - path: ../watchos-app/TimerCommandSender.swift
      - path: ../watchos-app/ModePickerView.swift
      - path: ../watchos-app/RatingPromptView.swift
      - path: ../watchos-app/StatsView.swift
      - path: ../watchos-app/ExtendedRuntimeSession.swift
      - path: WatchShell/Assets.xcassets
    info:
      path: WatchShell/Info.plist
      properties:
        CFBundleDisplayName: StudyLife
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.studylife.mobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studylife.mobile.watchkitapp
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        # New app icon (ring + S monogram) - no icon showed at all before this catalog existed.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Same App Group as the phone app - the watch's own LOCAL container under this same
    # group id is what WatchConnectivity-received data will be written to (Phase 1 step 4).
    entitlements:
      path: WatchShell/StudyLifeWatchShell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.studylife.mobile
    dependencies:
      - target: StudyLifeWatchWidgetsShell
        embed: true
  # Watch complication: CONFIRMED needs its own nested extension target, not the same
  # target as the watch app - a WidgetBundle's @main cannot share an executable with the
  # App's own @main (same reasoning as the iOS widget being its own app-extension target).
  StudyLifeWatchWidgetsShell:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ../watchos-app/Widgets/StudyLifeWatchWidgets.swift
      - path: ../watchos-app/WatchSnapshot.swift
    info:
      path: WatchWidgetsShell/Info.plist
      properties:
        CFBundleDisplayName: StudyLife
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studylife.mobile.watchkitapp.widgets
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    entitlements:
      path: WatchWidgetsShell/StudyLifeWatchWidgetsShell.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.studylife.mobile
